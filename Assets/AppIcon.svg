<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- LANA Traffic Analyzer — same visual language as LANA Scanner (tile, palette, glow, gloss). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#123A63"/>
      <stop offset="0.55" stop-color="#0A2342"/>
      <stop offset="1" stop-color="#061427"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2FE6B0" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#2FE6B0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2FE6B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensFill" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1B5A7A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0A2342" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2FE6B0" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2FE6B0" stop-opacity="0.9"/>
      <stop offset="0.82" stop-color="#4FB4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4FB4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lensGloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineglow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="lens"><circle cx="462" cy="462" r="200"/></clipPath>
  </defs>

  <!-- base tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <circle cx="512" cy="512" r="400" fill="url(#glow)"/>

    <!-- oscilloscope grid -->
    <g stroke="#5FF2C8" stroke-opacity="0.16" stroke-width="4">
      <line x1="150" y1="282" x2="874" y2="282"/>
      <line x1="150" y1="397" x2="874" y2="397"/>
      <line x1="150" y1="512" x2="874" y2="512"/>
      <line x1="150" y1="627" x2="874" y2="627"/>
      <line x1="150" y1="742" x2="874" y2="742"/>
      <line x1="282" y1="150" x2="282" y2="874"/>
      <line x1="512" y1="150" x2="512" y2="874"/>
      <line x1="742" y1="150" x2="742" y2="874"/>
    </g>

    <!-- traffic waveform (bursts = packets on the wire) -->
    <path d="M120 600 L210 600 L238 520 L262 680 L290 600 L380 600
             L404 470 L430 730 L456 560 L478 640 L500 600
             L600 600 L626 500 L652 700 L676 600 L770 600 L792 540 L812 660 L834 600 L904 600"
          fill="none" stroke="url(#wave)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"
          filter="url(#lineglow)" opacity="0.85"/>

    <!-- packets flowing on the wire -->
    <g filter="url(#dotglow)">
      <circle cx="560" cy="600" r="13" fill="#2FE6B0"/>
      <circle cx="725" cy="600" r="13" fill="#4FB4FF"/>
      <circle cx="860" cy="600" r="10" fill="#2FE6B0" opacity="0.8"/>
      <circle cx="170" cy="600" r="9" fill="#4FB4FF" opacity="0.7"/>
    </g>

    <!-- magnifier: handle -->
    <g filter="url(#soft)">
      <line x1="610" y1="610" x2="770" y2="770" stroke="#0A2342" stroke-width="74" stroke-linecap="round"/>
      <line x1="610" y1="610" x2="770" y2="770" stroke="#E9FFF8" stroke-width="54" stroke-linecap="round"/>
      <line x1="660" y1="660" x2="765" y2="765" stroke="#2FE6B0" stroke-width="20" stroke-linecap="round" stroke-opacity="0.85"/>
    </g>

    <!-- magnifier: lens with decoded packet list (rows highlighted like the app: normal / warning / error) -->
    <circle cx="462" cy="462" r="200" fill="url(#lensFill)" filter="url(#soft)"/>
    <g clip-path="url(#lens)">
      <g stroke="#5FF2C8" stroke-opacity="0.14" stroke-width="3">
        <line x1="262" y1="462" x2="662" y2="462"/>
      </g>
      <!-- packet rows: normal / warning (yellow) / error (red) / normal — as highlighted in the app -->
      <rect x="312" y="340" width="62" height="40" rx="20" fill="#2FE6B0"/>
      <rect x="390" y="340" width="200" height="40" rx="20" fill="#9FD8FF" fill-opacity="0.55"/>
      <rect x="296" y="400" width="332" height="56" rx="18" fill="#FFC24B" fill-opacity="0.22"/>
      <rect x="312" y="408" width="62" height="40" rx="20" fill="#FFC24B"/>
      <rect x="390" y="408" width="222" height="40" rx="20" fill="#FFE2A1" fill-opacity="0.75"/>
      <rect x="296" y="468" width="332" height="56" rx="18" fill="#FF5A6A" fill-opacity="0.22"/>
      <rect x="312" y="476" width="62" height="40" rx="20" fill="#FF5A6A"/>
      <rect x="390" y="476" width="170" height="40" rx="20" fill="#FFB3BB" fill-opacity="0.75"/>
      <rect x="312" y="544" width="62" height="40" rx="20" fill="#4FB4FF"/>
      <rect x="390" y="544" width="140" height="40" rx="20" fill="#9FD8FF" fill-opacity="0.55"/>
      <circle cx="462" cy="462" r="200" fill="url(#lensGloss)"/>
    </g>
    <circle cx="462" cy="462" r="200" fill="none" stroke="#E9FFF8" stroke-width="22"/>
    <circle cx="462" cy="462" r="200" fill="none" stroke="#2FE6B0" stroke-width="8" stroke-opacity="0.9"/>

    <!-- subtle gloss -->
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
</svg>
